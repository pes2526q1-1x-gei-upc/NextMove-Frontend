name: Firebase CD

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]

jobs:
  firebase_distribute:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'release/'))
    uses: ./.github/workflows/firebase_distribute.yml
    with:
      groups: ${{ github.event.workflow_run.head_branch == 'main' && 'internal,external' || 'internal' }}
    secrets: inherit