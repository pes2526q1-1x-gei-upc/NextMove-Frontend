name: Flutter CI

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/flutter_lint.yml
  test:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/flutter_test.yml
    with:
      coverage: true